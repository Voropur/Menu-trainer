<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тренажёр Меню</title>
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Меню-Тренер">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">
    <link rel="manifest" href='data:application/json,{"name":"Тренажёр Меню","short_name":"МенюТренер","start_url":".","display":"standalone","background_color":"#121212","theme_color":"#1a1a2e","icons":[{"src":"data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><text y=\".9em\" font-size=\"90\">🍜</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent: #ff4757;
            --green: #2ed573;
            --red: #ff4757;
            --text: #f1f2f6;
            --text-dim: #a4b0be;
            --border: #2f3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 30px;
        }

        header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.2rem;
            color: #fff;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 10px;
            margin: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .stat-item span {
            font-weight: bold;
            color: var(--accent);
        }

        .nav-tabs {
            display: flex;
            justify-content: flex-start;
            gap: 6px;
            margin: 0 15px 15px 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .container {
            padding: 0 15px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .dish-title {
            font-size: 1.25rem;
            margin-bottom: 15px;
            text-align: center;
            color: #fff;
        }

        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .ing-btn {
            background: #252530;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 8px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
        }

        .ing-btn.selected {
            background: #3b3b4f;
            border-color: #58587a;
        }

        .ing-btn.correct {
            background: var(--green) !important;
            color: #000 !important;
            font-weight: bold;
            border-color: var(--green) !important;
        }

        .ing-btn.wrong {
            background: var(--red) !important;
            color: white !important;
            border-color: var(--red) !important;
        }

        .tf-question {
            font-size: 1.1rem;
            text-align: center;
            margin: 20px 0;
            line-height: 1.5;
        }

        .tf-question highlight {
            color: #eccc68;
            font-weight: bold;
        }

        .tf-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .tf-btn {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .tf-btn.yes { background: var(--green); color: #000; }
        .tf-btn.no { background: var(--red); }

        .action-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .search-input, .select-input, .text-input {
            width: 100%;
            padding: 12px 15px;
            background: #252530;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .dict-item {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dict-item-info { flex: 1; }

        .dict-item h3 {
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .dict-item p {
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.4;
        }

        .del-btn {
            background: #ff475722;
            color: var(--red);
            border: 1px solid var(--red);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-left: 10px;
        }

        .mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mode-btn {
            flex: 1;
            padding: 8px;
            background: #252530;
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .mode-btn.active {
            background: #3b3b4f;
            color: white;
            border-color: var(--accent);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .hidden { display: none !important; }
        .feedback {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍜 Меню-Тренер (Офлайн)</h1>
    </header>

    <div class="stats-bar">
        <div class="stat-item">Блюд: <span id="total-dishes">0</span> 🍽️</div>
        <div class="stat-item">Серия: <span id="streak">0</span> 🔥</div>
        <div class="stat-item">Рекорд: <span id="max-streak">0</span> 🏆</div>
        <div class="stat-item">Ошибок: <span id="errors-count">0</span> ❌</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchMode('build', this)">🎮 Сбор</button>
        <button class="tab-btn" onclick="switchMode('tf', this)">⚡ Правда/Ложь</button>
        <button class="tab-btn" onclick="switchMode('checklist', this)">✅ Чек-лист</button>
        <button class="tab-btn" onclick="switchMode('dict', this)">📖 Меню</button>
        <button class="tab-btn" onclick="switchMode('edit', this)">✏️ Редактор</button>
    </div>

    <div class="container">
        
        <!-- РЕЖИМ 1: СБОР СОСТАВА -->
        <div id="mode-build">
            <div class="mode-switch">
                <button class="mode-btn active" onclick="setPool('all', this)">Все блюда</button>
                <button class="mode-btn" onclick="setPool('errors', this)">Только ошибки (<span id="err-badge">0</span>)</button>
            </div>

            <div class="card">
                <div class="dish-title" id="build-dish-name">Загрузка...</div>
                <div class="ingredients-grid" id="build-ingredients"></div>
                <button class="action-btn" id="build-check-btn" onclick="checkBuild()">Проверить</button>
            </div>
        </div>

        <!-- РЕЖИМ 2: ПРАВДА ИЛИ ЛОЖЬ -->
        <div id="mode-tf" class="hidden">
            <div class="card">
                <div class="dish-title" id="tf-dish-name">Загрузка...</div>
                <div class="tf-question" id="tf-question-text">...</div>
                <div class="tf-buttons" id="tf-actions">
                    <button class="tf-btn yes" onclick="answerTF(true)">ДА</button>
                    <button class="tf-btn no" onclick="answerTF(false)">НЕТ</button>
                </div>
                <div class="feedback hidden" id="tf-feedback"></div>
                <button class="action-btn hidden" id="tf-next-btn" style="margin-top:15px" onclick="nextTF()">Следующий вопрос ➔</button>
            </div>
        </div>

        <!-- РЕЖИМ 3: ЧЕК-ЛИСТ -->
        <div id="mode-checklist" class="hidden">
            <div class="card">
                <label style="font-size:0.85rem; color:var(--text-dim); display:block; margin-bottom:5px;">Выберите блюдо для самопроверки:</label>
                <select class="select-input" id="checklist-select" onchange="loadChecklist()"></select>
                <div class="ingredients-grid" id="checklist-grid"></div>
                <button class="action-btn" onclick="revealChecklist()">Показать верный состав</button>
            </div>
        </div>

        <!-- ВКЛАДКА: СПРАВОЧНИК -->
        <div id="mode-dict" class="hidden">
            <input type="text" class="search-input" id="search-bar" placeholder="Поиск блюда или ингредиента..." oninput="filterDict()">
            <div id="dict-list"></div>
        </div>

        <!-- ВКЛАДКА: РЕДАКТОР МЕНЮ -->
        <div id="mode-edit" class="hidden">
            <div class="card">
                <h2 style="font-size: 1.1rem; margin-bottom: 15px; color: var(--accent);">➕ Добавить новое блюдо</h2>
                <div class="form-group">
                    <label>Название блюда или соуса:</label>
                    <input type="text" class="text-input" id="new-dish-name" placeholder="Например: Рамен острый">
                </div>
                <div class="form-group">
                    <label>Ингредиенты (через запятую):</label>
                    <input type="text" class="text-input" id="new-dish-ings" placeholder="Лапша, бульон, яйцо, нори, свинина">
                </div>
                <button class="action-btn" style="background: var(--green); color:#000;" onclick="addNewDish()">Сохранить блюдо</button>
            </div>

            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h2 style="font-size: 1.1rem; color: #fff;">Управление позициями</h2>
                    <button class="del-btn" onclick="resetToDefault()">Сбросить всё</button>
                </div>
                <div id="edit-list"></div>
            </div>
        </div>

    </div>

    <script>
        const defaultMenu = [
            { id: 1, name: "Салатная заправка", ingredients: ["Устричный соус", "Соевый соус", "Сахар", "Белый рисовый уксус", "Чеснок", "Имбирь", "Зеленый лук", "Чили перец"] },
            { id: 2, name: "Крылышки Сычуаньские", ingredients: ["Качудян", "Томатная паста", "Соевый соус"] },
            { id: 3, name: "5 специй", ingredients: ["Бадьян", "Сычуаньский перец", "Корица", "Имбирь", "Кориандр"] },
            { id: 4, name: "Рисовый соус", ingredients: ["Кунжутное масло", "Устричный соус"] },
            { id: 5, name: "Чоу-мейн (соус)", ingredients: ["Соевый соус", "Устричный соус", "Темный соевый соус", "Белый рисовый уксус", "Кунжутное масло"] },
            { id: 6, name: "Удон (соус)", ingredients: ["Соевый соус", "Устричный соус", "Темный соевый соус", "Белый рисовый уксус", "Кунжутное масло"] },
            { id: 7, name: "Кисло-сладкий соус", ingredients: ["Белый рисовый уксус", "Сахар", "Кетчуп", "Соевый соус", "Ананасовый сок"] },
            { id: 8, name: "Гун бао соус", ingredients: ["Светлый соевый соус", "Темный соевый соус", "Сахар", "Маласянь", "Кунжутное масло", "Белый рисовый уксус"] },
            { id: 9, name: "Цзо соус", ingredients: ["Сахар", "Апельсиновый сок", "Хойсин", "Кетчуп", "Светлый соевый соус", "Темный соевый соус", "Белый рисовый уксус"] },
            { id: 10, name: "Апельсиновый соус", ingredients: ["Апельсиновый сок", "Цедра апельсина", "Апельсины", "Кунжутное масло", "Чеснок", "Имбирь"] },
            { id: 11, name: "Свинина веревочкой", ingredients: ["Свинина", "Вино шаосиньское", "Соевый соус", "Бамбук", "Морковь", "Основания зеленого лука", "Чеснок", "Имбирь", "Муэр", "Соус Табадзян", "Устричный соус"] },
            { id: 12, name: "Хун шао соус", ingredients: ["Бадьян", "Лавровый лист", "Корица", "Сычуаньский перец горошком", "Черный перец горошком", "Соевый соус", "Темный соевый соус", "Вино шаосиньское"] },
            { id: 13, name: "Пекинская свинина", ingredients: ["Свинина 150г", "Соус Барбекю", "Хойсин", "Чеснок", "Имбирь"] },
            { id: 14, name: "Говядина в ЧП", ingredients: ["Говядина", "Морковь", "Лук репчатый", "Перец болгарский", "Брокколи", "Мини кукуруза", "Фасоль", "Соус Блэк Пеппер"] },
            { id: 15, name: "Монгольская говядина", ingredients: ["Говядина", "Морковь", "Перец болгарский", "Лук репчатый", "Сушеный чили перец", "Соус чоу-мейн", "Зеленый лук перо", "Сахар", "Вино шаосиньское", "Основания зеленого лука"] },
            { id: 16, name: "Баранина", ingredients: ["Баранина", "Зира", "Кинза", "Фиолетовый лук", "Соевый соус", "Вино"] },
            { id: 17, name: "Креветки в тайском стиле", ingredients: ["Креветки", "Листья лайма", "Лемонграсс", "Чеснок", "Имбирь", "Тайваньская чили паста", "Базилик", "Соевый соус"] },
            { id: 18, name: "Баклажан со свининой", ingredients: ["Баклажан", "Свинина", "Соус Табадзян", "Чеснок", "Имбирь", "Сахар", "Вино шаосиньское"] },
            { id: 19, name: "Пикантный баклажан", ingredients: ["Баклажан", "Соевый соус темный", "Соевый соус светлый", "Белый рисовый уксус", "Сахар"] },
            { id: 20, name: "Тофу по-домашнему", ingredients: ["Тофу", "Основания зеленого лука", "Морковь", "Болгарский перец", "Шиитаке", "Муэр", "Соус Юсянь"] },
            { id: 21, name: "Три земных свежести", ingredients: ["Картофель/Перец/Баклажан", "Соус маласянь", "Устричный соус", "Сахар"] }
        ];

        // Загружаем меню из локального хранилища
        let menuData = JSON.parse(localStorage.getItem('customMenuData')) || defaultMenu;
        let allIngredients = [];

        function refreshIngredients() {
            allIngredients = Array.from(new Set(menuData.flatMap(d => d.ingredients)));
        }

        let currentDish = null;
        let selectedIngs = new Set();
        let streak = 0;
        let maxStreak = localStorage.getItem('maxStreak') || 0;
        let errorList = JSON.parse(localStorage.getItem('errorList')) || [];
        let poolType = 'all';
        let isChecked = false;
        let tfCurrent = {};

        document.getElementById('max-streak').textContent = maxStreak;

        function init() {
            refreshIngredients();
            updateStats();
            renderDict();
            renderEditList();
            initChecklistSelect();
            nextBuild();
            nextTF();
        }

        function saveMenuData() {
            localStorage.setItem('customMenuData', JSON.stringify(menuData));
            refreshIngredients();
            updateStats();
            renderDict();
            renderEditList();
            initChecklistSelect();
        }

        // Переключение режимов
        function switchMode(mode, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            ['build', 'tf', 'checklist', 'dict', 'edit'].forEach(m => {
                document.getElementById('mode-' + m).classList.add('hidden');
            });
            document.getElementById('mode-' + mode).classList.remove('hidden');
        }

        function setPool(type, btn) {
            if (type === 'errors' && errorList.length === 0) {
                alert("У вас пока нет ошибок!");
                return;
            }
            poolType = type;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            nextBuild();
        }

        // --- РЕЖИМ 1: СБОР СОСТАВА ---
        function nextBuild() {
            isChecked = false;
            selectedIngs.clear();
            
            if (menuData.length === 0) {
                document.getElementById('build-dish-name').textContent = "Меню пусто! Добавьте блюда в редакторе.";
                document.getElementById('build-ingredients').innerHTML = '';
                return;
            }

            let pool = menuData;
            if (poolType === 'errors' && errorList.length > 0) {
                pool = menuData.filter(d => errorList.includes(d.id));
                if (pool.length === 0) pool = menuData;
            }

            currentDish = pool[Math.floor(Math.random() * pool.length)];
            document.getElementById('build-dish-name').textContent = currentDish.name;

            const correct = currentDish.ingredients;
            const wrongCandidates = allIngredients.filter(i => !correct.includes(i));
            const wrong = wrongCandidates.sort(() => 0.5 - Math.random()).slice(0, Math.min(4, wrongCandidates.length));
            const options = [...correct, ...wrong].sort(() => 0.5 - Math.random());

            const container = document.getElementById('build-ingredients');
            container.innerHTML = '';
            
            options.forEach(ing => {
                const btn = document.createElement('button');
                btn.className = 'ing-btn';
                btn.textContent = ing;
                btn.onclick = () => {
                    if (isChecked) return;
                    if (selectedIngs.has(ing)) {
                        selectedIngs.delete(ing);
                        btn.classList.remove('selected');
                    } else {
                        selectedIngs.add(ing);
                        btn.classList.add('selected');
                    }
                };
                container.appendChild(btn);
            });

            const checkBtn = document.getElementById('build-check-btn');
            checkBtn.textContent = 'Проверить';
            checkBtn.style.background = 'var(--accent)';
        }

        function checkBuild() {
            if (!currentDish || menuData.length === 0) return;
            if (isChecked) {
                nextBuild();
                return;
            }
            if (selectedIngs.size === 0) {
                alert("Выберите хотя бы один ингредиент!");
                return;
            }

            isChecked = true;
            const correctSet = new Set(currentDish.ingredients);
            let isCorrect = (selectedIngs.size === correctSet.size);
            
            if (isCorrect) {
                for (let item of selectedIngs) {
                    if (!correctSet.has(item)) { isCorrect = false; break; }
                }
            }

            document.querySelectorAll('#build-ingredients .ing-btn').forEach(btn => {
                const text = btn.textContent;
                if (correctSet.has(text)) btn.classList.add('correct');
                else if (selectedIngs.has(text)) btn.classList.add('wrong');
            });

            handleResult(isCorrect, currentDish.id);
            const checkBtn = document.getElementById('build-check-btn');
            checkBtn.textContent = 'Следующее блюдо ➔';
            checkBtn.style.background = isCorrect ? 'var(--green)' : 'var(--red)';
        }

        // --- РЕЖИМ 2: ПРАВДА / ЛОЖЬ ---
        function nextTF() {
            if (menuData.length === 0) return;
            document.getElementById('tf-actions').classList.remove('hidden');
            document.getElementById('tf-feedback').classList.add('hidden');
            document.getElementById('tf-next-btn').classList.add('hidden');

            const dish = menuData[Math.floor(Math.random() * menuData.length)];
            const shouldBeTrue = Math.random() > 0.5;
            let ingredient = '';

            if (shouldBeTrue || allIngredients.length <= dish.ingredients.length) {
                ingredient = dish.ingredients[Math.floor(Math.random() * dish.ingredients.length)];
            } else {
                const wrongList = allIngredients.filter(i => !dish.ingredients.includes(i));
                ingredient = wrongList[Math.floor(Math.random() * wrongList.length)];
            }

            tfCurrent = { dish, ingredient, isTrue: shouldBeTrue };

            document.getElementById('tf-dish-name').textContent = dish.name;
            document.getElementById('tf-question-text').innerHTML = `Входит ли <highlight>"${ingredient}"</highlight> в состав?`;
        }

        function answerTF(userAnswer) {
            const isCorrect = (userAnswer === tfCurrent.isTrue);
            document.getElementById('tf-actions').classList.add('hidden');
            
            const feedback = document.getElementById('tf-feedback');
            feedback.classList.remove('hidden');
            
            if (isCorrect) {
                feedback.textContent = "Правильно! 🎉";
                feedback.style.color = "var(--green)";
            } else {
                feedback.textContent = tfCurrent.isTrue 
                    ? `Ошибка! "${tfCurrent.ingredient}" ДЕЙСТВИТЕЛЬНО входит в состав.` 
                    : `Ошибка! "${tfCurrent.ingredient}" НЕ входит в состав.`;
                feedback.style.color = "var(--red)";
            }

            handleResult(isCorrect, tfCurrent.dish.id);
            document.getElementById('tf-next-btn').classList.remove('hidden');
        }

        // --- РЕЖИМ 3: ЧЕК-ЛИСТ ---
        function initChecklistSelect() {
            const select = document.getElementById('checklist-select');
            select.innerHTML = '';
            menuData.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = `${d.id}. ${d.name}`;
                select.appendChild(opt);
            });
            if (menuData.length > 0) loadChecklist();
        }

        function loadChecklist() {
            const id = parseInt(document.getElementById('checklist-select').value);
            const dish = menuData.find(d => d.id === id);
            if (!dish) return;
            const container = document.getElementById('checklist-grid');
            container.innerHTML = '';

            const wrongCandidates = allIngredients.filter(i => !dish.ingredients.includes(i));
            const wrong = wrongCandidates.sort(() => 0.5 - Math.random()).slice(0, 4);
            const options = [...dish.ingredients, ...wrong].sort(() => 0.5 - Math.random());

            options.forEach(ing => {
                const btn = document.createElement('button');
                btn.className = 'ing-btn';
                btn.textContent = ing;
                btn.onclick = () => btn.classList.toggle('selected');
                container.appendChild(btn);
            });
        }

        function revealChecklist() {
            const id = parseInt(document.getElementById('checklist-select').value);
            const dish = menuData.find(d => d.id === id);
            if (!dish) return;
            const correctSet = new Set(dish.ingredients);

            document.querySelectorAll('#checklist-grid .ing-btn').forEach(btn => {
                if (correctSet.has(btn.textContent)) {
                    btn.classList.add('correct');
                } else if (btn.classList.contains('selected')) {
                    btn.classList.add('wrong');
                }
            });
        }

        // --- РЕДАКТОР МЕНЮ ---
        function addNewDish() {
            const nameInput = document.getElementById('new-dish-name');
            const ingsInput = document.getElementById('new-dish-ings');

            const name = nameInput.value.trim();
            const ingsRaw = ingsInput.value.trim();

            if (!name || !ingsRaw) {
                alert("Заполните название и состав блюда!");
                return;
            }

            const ingredients = ingsRaw.split(',').map(i => i.trim()).filter(i => i.length > 0);

            if (ingredients.length === 0) {
                alert("Введите хотя бы один ингредиент!");
                return;
            }

            const newId = menuData.length > 0 ? Math.max(...menuData.map(d => d.id)) + 1 : 1;
            menuData.push({ id: newId, name, ingredients });

            saveMenuData();
            nameInput.value = '';
            ingsInput.value = '';
            alert(`Блюдо "${name}" успешно добавлено!`);
        }

        function deleteDish(id) {
            if (confirm("Удалить это блюдо из меню?")) {
                menuData = menuData.filter(d => d.id !== id);
                errorList = errorList.filter(eId => eId !== id);
                localStorage.setItem('errorList', JSON.stringify(errorList));
                saveMenuData();
            }
        }

        function resetToDefault() {
            if (confirm("Восстановить исходное меню из 21 позиции? Все ваши добавленные блюда сбросятся.")) {
                menuData = [...defaultMenu];
                saveMenuData();
            }
        }

        function renderEditList() {
            const container = document.getElementById('edit-list');
            container.innerHTML = '';
            
            menuData.forEach(d => {
                const item = document.createElement('div');
                item.className = 'dict-item';
                item.innerHTML = `
                    <div class="dict-item-info">
                        <h3>${d.id}. ${d.name}</h3>
                        <p>${d.ingredients.join(', ')}</p>
                    </div>
                    <button class="del-btn" onclick="deleteDish(${d.id})">Удалить</button>
                `;
                container.appendChild(item);
            });
        }

        // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
        function handleResult(isCorrect, dishId) {
            if (isCorrect) {
                streak++;
                if (streak > maxStreak) {
                    maxStreak = streak;
                    localStorage.setItem('maxStreak', maxStreak);
                }
                errorList = errorList.filter(id => id !== dishId);
            } else {
                streak = 0;
                if (!errorList.includes(dishId)) errorList.push(dishId);
            }
            localStorage.setItem('errorList', JSON.stringify(errorList));
            updateStats();
        }

        function updateStats() {
            document.getElementById('total-dishes').textContent = menuData.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('max-streak').textContent = maxStreak;
            document.getElementById('errors-count').textContent = errorList.length;
            document.getElementById('err-badge').textContent = errorList.length;
        }

        function renderDict(filter = '') {
            const container = document.getElementById('dict-list');
            container.innerHTML = '';
            const filtered = menuData.filter(d => 
                d.name.toLowerCase().includes(filter.toLowerCase()) || 
                d.ingredients.some(i => i.toLowerCase().includes(filter.toLowerCase()))
            );
            filtered.forEach(d => {
                const item = document.createElement('div');
                item.className = 'dict-item';
                item.innerHTML = `<div class="dict-item-info"><h3>${d.id}. ${d.name}</h3><p><b>Состав:</b> ${d.ingredients.join(', ')}</p></div>`;
                container.appendChild(item);
            });
        }

        function filterDict() {
            renderDict(document.getElementById('search-bar').value);
        }

        // Автономный Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const blob = new Blob([`
                    self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
                `], { type: 'text/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }

        init();
    </script>
</body>
</html>
