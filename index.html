<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProMenu Master</title>
    <meta name="theme-color" content="#0b101b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ProMenu">
    <style>
        :root {
            --bg-dark: #070a12;
            --card-bg: #0e1424;
            --card-border: #1a233b;
            --accent-pink: #ff2a55;
            --chip-bg: #151d30;
            --chip-border: #232f4d;
            --chip-selected-bg: #4a1122;
            --chip-selected-border: #ff2a55;
            --green: #2ed573;
            --missed-yellow: #f1c40f;
            --text-main: #f0f4f8;
            --text-sub: #7a8b9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Шапка приложения */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(255, 126, 95, 0.3);
        }

        .app-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }

        .app-subtitle {
            font-size: 0.78rem;
            color: #e2a03f;
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .streak-pill {
            background: #111a2e;
            border: 1px solid #1f2d4d;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #38ef7d;
        }

        .streak-pill span {
            color: #7a8b9e;
        }

        .dict-icon-btn {
            background: #111a2e;
            border: 1px solid #1f2d4d;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Панель режимов */
        .modes-nav {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 6px;
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
        }

        .mode-tab {
            flex: 1;
            padding: 10px 6px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            line-height: 1.3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .mode-tab.active {
            background: var(--accent-pink);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 42, 85, 0.4);
        }

        /* Главная карточка вопроса */
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 22px 18px;
            margin-bottom: 20px;
            position: relative;
        }

        .card-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-badge {
            background: #2a1220;
            color: var(--accent-pink);
            border: 1px solid #4d1832;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .skip-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 0.82rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .dish-header {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .question-desc {
            font-size: 0.88rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .question-desc b {
            color: #fff;
        }

        /* Варианты ингредиентов (Чипсы) */
        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: flex-start;
        }

        .chip {
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .chip.selected {
            background: var(--chip-selected-bg);
            border-color: var(--chip-selected-border);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 42, 85, 0.2);
        }

        /* Подсвечивание при проверке */
        .chip.correct {
            background: #0f3822 !important;
            border-color: var(--green) !important;
            color: #fff !important;
        }

        .chip.wrong {
            background: #4a1122 !important;
            border-color: var(--accent-pink) !important;
            color: #fff !important;
            text-decoration: line-through;
        }

        .chip.missed {
            background: #383011 !important;
            border: 2px dashed var(--missed-yellow) !important;
            color: #ffeaa7 !important;
            font-weight: bold;
        }

        /* Развернутая текстовая обратная связь */
        .feedback-box {
            background: #131a2b;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            line-height: 1.5;
            border: 1px solid var(--card-border);
        }

        .feedback-box.correct-box {
            border-color: var(--green);
            background: #0d2618;
            color: #2ed573;
        }

        .feedback-box.error-box {
            border-color: var(--accent-pink);
            background: #260e17;
        }

        .feedback-title {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 6px;
        }

        .feedback-detail {
            color: var(--text-sub);
            margin-top: 4px;
        }

        .feedback-detail b.missed-txt { color: var(--missed-yellow); }
        .feedback-detail b.extra-txt { color: var(--accent-pink); }

        /* Кнопка действия */
        .primary-btn {
            width: 100%;
            background: var(--accent-pink);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(255, 42, 85, 0.3);
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        /* Нижние ссылки управления */
        .bottom-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
            font-size: 0.82rem;
            margin-bottom: 30px;
        }

        .errors-link {
            color: #f39c12;
            text-decoration: none;
            cursor: pointer;
        }

        .reset-link {
            color: var(--text-sub);
            text-decoration: underline;
            cursor: pointer;
        }

        .footer-note {
            text-align: center;
            font-size: 0.72rem;
            color: #3e4e66;
            margin-top: auto;
            padding-bottom: 10px;
        }

        /* Модалка / Вкладка справочника и редактора */
        .overlay-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .search-input, .text-input, .select-input {
            width: 100%;
            padding: 12px 14px;
            background: #131a2b;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-size: 0.88rem;
            margin-bottom: 12px;
        }

        .dict-item {
            background: #111726;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 1px solid var(--card-border);
        }

        .dict-item h4 {
            color: var(--accent-pink);
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .dict-item p {
            color: var(--text-sub);
            font-size: 0.82rem;
            line-height: 1.4;
        }

        .tf-question {
            font-size: 1.1rem;
            text-align: center;
            margin: 20px 0;
            line-height: 1.5;
        }

        .tf-question highlight {
            color: #eccc68;
            font-weight: bold;
        }

        .tf-buttons {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .tf-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .tf-btn.yes { background: var(--green); color: #000; }
        .tf-btn.no { background: var(--accent-pink); color: #fff; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="app-header">
        <div class="header-left">
            <div class="app-icon">🥢</div>
            <div>
                <div class="app-title">ProMenu Master</div>
                <div class="app-subtitle" id="subtitle-count">Азиатская кухня • 21 позиция</div>
            </div>
        </div>
        <div class="header-right">
            <div class="streak-pill">🔥 <span id="streak-val">1</span> <span>|</span> <span id="max-val" style="color:#2ed573">1</span></div>
            <div class="dict-icon-btn" onclick="toggleDict()">📖</div>
        </div>
    </div>

    <!-- Вкладки режимов -->
    <div class="modes-nav">
        <button class="mode-tab active" id="tab-build" onclick="switchTab('build')">
            <span>🎯 Сбор</span>
            <span>состава</span>
        </button>
        <button class="mode-tab" id="tab-tf" onclick="switchTab('tf')">
            <span>⚡ Правда /</span>
            <span>Ложь</span>
        </button>
        <button class="mode-tab" id="tab-checklist" onclick="switchTab('checklist')">
            <span>📝 Чек-лист по</span>
            <span>блюду</span>
        </button>
    </div>

    <!-- 1. РЕЖИМ: СБОР СОСТАВА -->
    <div id="view-build">
        <div class="question-card">
            <div class="card-top-bar">
                <span class="question-badge" id="q-number">ВОПРОС 1</span>
                <button class="skip-btn" onclick="nextBuild()">Пропустить ➔</button>
            </div>

            <div class="dish-header" id="build-dish-title">Загрузка...</div>
            <div class="question-desc">Выберите <b>ВСЕ</b> правильные ингредиенты для этого блюда:</div>

            <div class="chips-container" id="build-chips"></div>

            <div id="build-feedback" class="feedback-box hidden"></div>

            <button class="primary-btn" id="build-action-btn" onclick="checkBuild()">Проверить ответ</button>
        </div>
    </div>

    <!-- 2. РЕЖИМ: ПРАВДА ИЛИ ЛОЖЬ -->
    <div id="view-tf" class="hidden">
        <div class="question-card">
            <div class="dish-header" id="tf-dish-title">Загрузка...</div>
            <div class="tf-question" id="tf-question-text">...</div>
            <div class="tf-buttons" id="tf-actions">
                <button class="tf-btn yes" onclick="answerTF(true)">ДА</button>
                <button class="tf-btn no" onclick="answerTF(false)">НЕТ</button>
            </div>
            <div id="tf-feedback" style="text-align:center; font-weight:bold; margin-top:15px;" class="hidden"></div>
            <button class="primary-btn hidden" id="tf-next-btn" style="margin-top:15px;" onclick="nextTF()">Следующий вопрос ➔</button>
        </div>
    </div>

    <!-- 3. РЕЖИМ: ЧЕК-ЛИСТ -->
    <div id="view-checklist" class="hidden">
        <div class="question-card">
            <label style="font-size:0.8rem; color:var(--text-sub); display:block; margin-bottom:8px;">Выберите блюдо для самопроверки:</label>
            <select class="select-input" id="checklist-select" onchange="loadChecklist()"></select>
            <div class="chips-container" id="checklist-chips"></div>
            <button class="primary-btn" onclick="revealChecklist()">Показать верный состав</button>
        </div>
    </div>

    <!-- 4. ЭКРАН: СПРАВОЧНИК И РЕДАКТОР -->
    <div id="view-dict" class="hidden">
        <div class="overlay-card">
            <h3 style="font-size:1.05rem; margin-bottom:12px; color:#fff;">➕ Добавить новое блюдо</h3>
            <input type="text" class="text-input" id="new-name" placeholder="Название блюда">
            <input type="text" class="text-input" id="new-ings" placeholder="Ингредиенты через запятую">
            <button class="primary-btn" style="padding:10px; background:var(--green); color:#000;" onclick="addNewDish()">Сохранить</button>
        </div>

        <div class="overlay-card">
            <input type="text" class="search-input" id="search-bar" placeholder="Поиск по меню..." oninput="filterDict()">
            <div id="dict-list"></div>
        </div>
    </div>

    <!-- Нижняя панель действий -->
    <div class="bottom-actions">
        <a class="errors-link" onclick="toggleErrorFilter()">⚠️ Мои ошибки ( <span id="err-count">0</span> )</a>
        <a class="reset-link" onclick="resetStats()">Сбросить статистику</a>
    </div>

    <div class="footer-note">
        Asian Kitchen Menu Trainer • Обучающий игровой модуль
    </div>

    <script>
        const defaultMenu = [
            { id: 1, name: "1. Салатная заправка", ingredients: ["устричный соус", "соевый соус", "сахар", "белый рисовый уксус", "чеснок", "имбирь", "зеленый лук", "чили перец"] },
            { id: 2, name: "2. Крылышки Сычуаньские", ingredients: ["качудян", "томатная паста", "соевый соус"] },
            { id: 3, name: "3. 5 специй", ingredients: ["бадьян", "сычуаньский перец", "корица", "имбирь", "кориандр"] },
            { id: 4, name: "4. Рисовый соус", ingredients: ["кунжутное масло", "устричный соус"] },
            { id: 5, name: "5. Чоу-мейн (соус)", ingredients: ["соевый соус", "устричный соус", "темный соевый соус", "белый рисовый уксус", "кунжутное масло"] },
            { id: 6, name: "6. Удон (соус)", ingredients: ["соевый соус", "устричный соус", "темный соевый соус", "белый рисовый уксус", "кунжутное масло"] },
            { id: 7, name: "7. Кисло-сладкий соус", ingredients: ["белый рисовый уксус", "сахар", "кетчуп", "соевый соус", "ананасовый сок"] },
            { id: 8, name: "8. Гун бао соус", ingredients: ["светлый соевый соус", "темный соевый соус", "сахар", "маласянь", "кунжутное масло", "белый рисовый уксус"] },
            { id: 9, name: "9. Цзо соус", ingredients: ["сахар", "апельсиновый сок", "хойсин", "кетчуп", "светлый соевый соус", "темный соевый соус", "белый рисовый уксус"] },
            { id: 10, name: "10. Апельсиновый соус", ingredients: ["апельсиновый сок", "цедра апельсина", "апельсины", "кунжутное масло", "чеснок", "имбирь"] },
            { id: 11, name: "11. Свинина веревочкой", ingredients: ["свинина", "вино шаосиньское", "соевый соус", "бамбук", "морковь", "основания зеленого лука", "чеснок", "имбирь", "муэр", "соус табадзян", "устричный соус"] },
            { id: 12, name: "12. Хун шао соус", ingredients: ["бадьян", "лавровый лист", "корица", "сычуаньский перец горошком", "черный перец горошком", "соевый соус", "темный соевый соус", "вино шаосиньское"] },
            { id: 13, name: "13. Пекинская свинина", ingredients: ["свинина 150г", "соус барбекю", "хойсин", "чеснок", "имбирь"] },
            { id: 14, name: "14. Говядина в ЧП (Черный перец)", ingredients: ["морковь", "лук", "перец", "брокколи", "мини-кукуруза", "стручковая фасоль", "соус блэк пеппер"] },
            { id: 15, name: "15. Монгольская говядина", ingredients: ["говядина", "морковь", "болгарский перец", "лук репчатый", "сушеный чили перец", "соус чоу-мейн", "лук перо", "сахар", "вино шаосиньское", "основания лука"] },
            { id: 16, name: "16. Баранина", ingredients: ["баранина", "зира", "кинза", "фиолетовый лук", "соевый соус", "вино"] },
            { id: 17, name: "17. Креветки в тайском стиле", ingredients: ["креветки", "листья лайма", "лемонграсс", "чеснок", "имбирь", "соус тайваньской чили пасты", "базилик", "соевый соус"] },
            { id: 18, name: "18. Баклажан со свининой", ingredients: ["баклажан", "свинина", "соус табадзян", "чеснок", "имбирь", "сахар", "вино шаосиньское"] },
            { id: 19, name: "19. Пикантный баклажан", ingredients: ["баклажан", "соевый соус темный", "соевый соус светлый", "белый рисовый уксус", "сахар"] },
            { id: 20, name: "20. Тофу по-домашнему", ingredients: ["тофу", "основания лука", "морковь", "болгарский перец", "шиитаке", "муэр", "соус юсянь"] },
            { id: 21, name: "21. Три земных свежести", ingredients: ["картофель/перец/баклажан", "соус маласянь", "устричный соус", "сахар"] }
        ];

        let menuData = JSON.parse(localStorage.getItem('customMenuData')) || defaultMenu;
        let allIngredients = [];
        let questionCounter = 1;

        function refreshIngredients() {
            allIngredients = Array.from(new Set(menuData.flatMap(d => d.ingredients)));
        }

        let currentDish = null;
        let selectedChips = new Set();
        let streak = 0;
        let maxStreak = localStorage.getItem('maxStreak') || 0;
        let errorList = JSON.parse(localStorage.getItem('errorList')) || [];
        let isChecked = false;
        let tfCurrent = {};
        let onlyErrorsMode = false;

        function init() {
            refreshIngredients();
            updateStats();
            renderDict();
            initChecklistSelect();
            nextBuild();
            nextTF();
        }

        function switchTab(tab) {
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            ['build', 'tf', 'checklist', 'dict'].forEach(v => document.getElementById('view-' + v).classList.add('hidden'));

            if (tab !== 'dict') {
                document.getElementById('tab-' + tab).classList.add('active');
                document.getElementById('view-' + tab).classList.remove('hidden');
            } else {
                document.getElementById('view-dict').classList.remove('hidden');
            }
        }

        function toggleDict() {
            const isDictVisible = !document.getElementById('view-dict').classList.contains('hidden');
            if (isDictVisible) {
                switchTab('build');
            } else {
                switchTab('dict');
            }
        }

        /* --- РЕЖИМ: СБОР СОСТАВА --- */
        function nextBuild() {
            isChecked = false;
            selectedChips.clear();
            document.getElementById('q-number').textContent = `ВОПРОС ${questionCounter++}`;
            document.getElementById('build-feedback').classList.add('hidden');

            let pool = menuData;
            if (onlyErrorsMode && errorList.length > 0) {
                pool = menuData.filter(d => errorList.includes(d.id));
            }

            currentDish = pool[Math.floor(Math.random() * pool.length)];
            document.getElementById('build-dish-title').textContent = currentDish.name;

            const correct = currentDish.ingredients;
            const wrongCandidates = allIngredients.filter(i => !correct.includes(i));
            const wrong = wrongCandidates.sort(() => 0.5 - Math.random()).slice(0, Math.min(4, wrongCandidates.length));
            const options = [...correct, ...wrong].sort(() => 0.5 - Math.random());

            const container = document.getElementById('build-chips');
            container.innerHTML = '';

            options.forEach(ing => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.textContent = ing;
                chip.onclick = () => {
                    if (isChecked) return;
                    if (selectedChips.has(ing)) {
                        selectedChips.delete(ing);
                        chip.classList.remove('selected');
                    } else {
                        selectedChips.add(ing);
                        chip.classList.add('selected');
                    }
                };
                container.appendChild(chip);
            });

            const btn = document.getElementById('build-action-btn');
            btn.textContent = 'Проверить ответ';
            btn.style.background = 'var(--accent-pink)';
        }

        function checkBuild() {
            if (isChecked) {
                nextBuild();
                return;
            }
            if (selectedChips.size === 0) {
                alert("Выберите хотя бы один ингредиент!");
                return;
            }

            isChecked = true;
            const correctSet = new Set(currentDish.ingredients);
            
            const missedIngs = [];
            const extraIngs = [];

            // Проверяем выбранные и невыбранные ингредиенты
            document.querySelectorAll('#build-chips .chip').forEach(chip => {
                const text = chip.textContent;
                const isSelected = selectedChips.has(text);
                const isCorrect = correctSet.has(text);

                if (isSelected && isCorrect) {
                    chip.classList.add('correct');
                } else if (isSelected && !isCorrect) {
                    chip.classList.add('wrong');
                    extraIngs.push(text);
                } else if (!isSelected && isCorrect) {
                    chip.classList.add('missed');
                    missedIngs.push(text);
                }
            });

            const isTotallyCorrect = (missedIngs.length === 0 && extraIngs.length === 0);

            // Показываем подробный разбор
            const feedbackBox = document.getElementById('build-feedback');
            feedbackBox.classList.remove('hidden');

            if (isTotallyCorrect) {
                feedbackBox.className = "feedback-box correct-box";
                feedbackBox.innerHTML = `
                    <div class="feedback-title">🎉 Идеально!</div>
                    <div class="feedback-detail">Вы выбрали абсолютно все правильные ингредиенты.</div>
                `;
            } else {
                feedbackBox.className = "feedback-box error-box";
                let html = `<div class="feedback-title">❌ Есть ошибки в составе:</div>`;
                
                if (missedIngs.length > 0) {
                    html += `<div class="feedback-detail">🟡 <b class="missed-txt">Забыли добавить:</b> ${missedIngs.join(', ')}</div>`;
                }
                if (extraIngs.length > 0) {
                    html += `<div class="feedback-detail">🔴 <b class="extra-txt">Лишние ингредиенты:</b> ${extraIngs.join(', ')}</div>`;
                }

                feedbackBox.innerHTML = html;
            }

            handleResult(isTotallyCorrect, currentDish.id);
            const btn = document.getElementById('build-action-btn');
            btn.textContent = 'Следующее блюдо ➔';
            btn.style.background = isTotallyCorrect ? 'var(--green)' : 'var(--accent-pink)';
        }

        /* --- РЕЖИМ: ПРАВДА / ЛОЖЬ --- */
        function nextTF() {
            document.getElementById('tf-actions').classList.remove('hidden');
            document.getElementById('tf-feedback').classList.add('hidden');
            document.getElementById('tf-next-btn').classList.add('hidden');

            const dish = menuData[Math.floor(Math.random() * menuData.length)];
            const shouldBeTrue = Math.random() > 0.5;
            let ingredient = '';

            if (shouldBeTrue) {
                ingredient = dish.ingredients[Math.floor(Math.random() * dish.ingredients.length)];
            } else {
                const wrongList = allIngredients.filter(i => !dish.ingredients.includes(i));
                ingredient = wrongList[Math.floor(Math.random() * wrongList.length)];
            }

            tfCurrent = { dish, ingredient, isTrue: shouldBeTrue };
            document.getElementById('tf-dish-title').textContent = dish.name;
            document.getElementById('tf-question-text').innerHTML = `Входит ли <highlight>"${ingredient}"</highlight> в этот состав?`;
        }

        function answerTF(ans) {
            const isCorrect = (ans === tfCurrent.isTrue);
            document.getElementById('tf-actions').classList.add('hidden');
            const fb = document.getElementById('tf-feedback');
            fb.classList.remove('hidden');

            if (isCorrect) {
                fb.textContent = "Правильно! 🎉";
                fb.style.color = "var(--green)";
            } else {
                fb.textContent = "Ошибка! ❌";
                fb.style.color = "var(--accent-pink)";
            }

            handleResult(isCorrect, tfCurrent.dish.id);
            document.getElementById('tf-next-btn').classList.remove('hidden');
        }

        /* --- ЧЕК-ЛИСТ --- */
        function initChecklistSelect() {
            const select = document.getElementById('checklist-select');
            select.innerHTML = '';
            menuData.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.name;
                select.appendChild(opt);
            });
            if (menuData.length > 0) loadChecklist();
        }

        function loadChecklist() {
            const id = parseInt(document.getElementById('checklist-select').value);
            const dish = menuData.find(d => d.id === id);
            const container = document.getElementById('checklist-chips');
            container.innerHTML = '';

            const wrongCandidates = allIngredients.filter(i => !dish.ingredients.includes(i));
            const wrong = wrongCandidates.sort(() => 0.5 - Math.random()).slice(0, 4);
            const options = [...dish.ingredients, ...wrong].sort(() => 0.5 - Math.random());

            options.forEach(ing => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.textContent = ing;
                chip.onclick = () => chip.classList.toggle('selected');
                container.appendChild(chip);
            });
        }

        function revealChecklist() {
            const id = parseInt(document.getElementById('checklist-select').value);
            const dish = menuData.find(d => d.id === id);
            const correctSet = new Set(dish.ingredients);

            document.querySelectorAll('#checklist-chips .chip').forEach(chip => {
                if (correctSet.has(chip.textContent)) chip.classList.add('correct');
                else if (chip.classList.contains('selected')) chip.classList.add('wrong');
            });
        }

        /* --- РЕДАКТОР И СПРАВОЧНИК --- */
        function addNewDish() {
            const name = document.getElementById('new-name').value.trim();
            const ings = document.getElementById('new-ings').value.trim();
            if (!name || !ings) return alert("Заполните название и состав!");

            const ingredients = ings.split(',').map(i => i.trim().toLowerCase()).filter(i => i);
            const newId = menuData.length > 0 ? Math.max(...menuData.map(d => d.id)) + 1 : 1;

            menuData.push({ id: newId, name: `${newId}. ${name}`, ingredients });
            localStorage.setItem('customMenuData', JSON.stringify(menuData));
            refreshIngredients();
            updateStats();
            renderDict();
            initChecklistSelect();
            document.getElementById('new-name').value = '';
            document.getElementById('new-ings').value = '';
            alert("Блюдо добавлено!");
        }

        function handleResult(isCorrect, dishId) {
            if (isCorrect) {
                streak++;
                if (streak > maxStreak) {
                    maxStreak = streak;
                    localStorage.setItem('maxStreak', maxStreak);
                }
                errorList = errorList.filter(id => id !== dishId);
            } else {
                streak = 0;
                if (!errorList.includes(dishId)) errorList.push(dishId);
            }
            localStorage.setItem('errorList', JSON.stringify(errorList));
            updateStats();
        }

        function updateStats() {
            document.getElementById('streak-val').textContent = streak;
            document.getElementById('max-val').textContent = maxStreak;
            document.getElementById('err-count').textContent = errorList.length;
            document.getElementById('subtitle-count').textContent = `Азиатская кухня • ${menuData.length} позиций`;
        }

        function toggleErrorFilter() {
            if (errorList.length === 0) return alert("У вас пока нет ошибочных позиций!");
            onlyErrorsMode = !onlyErrorsMode;
            alert(onlyErrorsMode ? "Включен режим повторения ошибок!" : "Режим всех блюд активирован.");
            nextBuild();
        }

        function resetStats() {
            if (confirm("Сбросить статистику серии и список ошибок?")) {
                streak = 0;
                errorList = [];
                localStorage.removeItem('errorList');
                updateStats();
            }
        }

        function renderDict(filter = '') {
            const container = document.getElementById('dict-list');
            container.innerHTML = '';
            const filtered = menuData.filter(d => 
                d.name.toLowerCase().includes(filter.toLowerCase()) || 
                d.ingredients.some(i => i.toLowerCase().includes(filter.toLowerCase()))
            );
            filtered.forEach(d => {
                const item = document.createElement('div');
                item.className = 'dict-item';
                item.innerHTML = `<h4>${d.name}</h4><p><b>Состав:</b> ${d.ingredients.join(', ')}</p>`;
                container.appendChild(item);
            });
        }

        function filterDict() {
            renderDict(document.getElementById('search-bar').value);
        }

        init();
    </script>
</body>
</html>
