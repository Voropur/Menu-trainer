<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тренажёр Меню</title>
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Меню-Тренер">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">
    <link rel="manifest" href='data:application/json,{"name":"Тренажёр Меню","short_name":"МенюТренер","start_url":".","display":"standalone","background_color":"#121212","theme_color":"#1a1a2e","icons":[{"src":"data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><text y=\".9em\" font-size=\"90\">🍜</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent: #ff4757;
            --accent-hover: #ff6b81;
            --green: #2ed573;
            --red: #ff4757;
            --text: #f1f2f6;
            --text-dim: #a4b0be;
            --border: #2f3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 30px;
        }

        header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.2rem;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 10px;
            margin: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .stat-item span {
            font-weight: bold;
            color: var(--accent);
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 0 15px 15px 15px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .container {
            padding: 0 15px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .dish-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-align: center;
            color: #fff;
        }

        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .ing-btn {
            background: #252530;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 8px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
        }

        .ing-btn.selected {
            background: #3b3b4f;
            border-color: #58587a;
        }

        .ing-btn.correct {
            background: var(--green) !important;
            color: #000 !important;
            font-weight: bold;
            border-color: var(--green) !important;
        }

        .ing-btn.wrong {
            background: var(--red) !important;
            color: white !important;
            border-color: var(--red) !important;
        }

        .action-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Поисковик и справочник */
        .search-input {
            width: 100%;
            padding: 12px 15px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .dict-item {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .dict-item h3 {
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .dict-item p {
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.4;
        }

        /* Переключатель режимов */
        .mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mode-btn {
            flex: 1;
            padding: 8px;
            background: #252530;
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .mode-btn.active {
            background: #3b3b4f;
            color: white;
            border-color: var(--accent);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>🍜 Меню-Тренер (Офлайн)</h1>
    </header>

    <div class="stats-bar">
        <div class="stat-item">Серия: <span id="streak">0</span> 🔥</div>
        <div class="stat-item">Рекорд: <span id="max-streak">0</span> 🏆</div>
        <div class="stat-item">Ошибок: <span id="errors-count">0</span> ❌</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('game')">🎮 Игра</button>
        <button class="tab-btn" onclick="switchTab('dict')">📖 Меню (21)</button>
    </div>

    <div class="container">
        <!-- Вкладка игры -->
        <div id="game-tab">
            <div class="mode-switch">
                <button class="mode-btn active" onclick="setGameMode('all', this)">Все блюда</button>
                <button class="mode-btn" onclick="setGameMode('errors', this)">Только ошибки (<span id="err-badge">0</span>)</button>
            </div>

            <div class="card">
                <div class="dish-title" id="dish-name">Загрузка...</div>
                <div class="ingredients-grid" id="ingredients-container"></div>
                <button class="action-btn" id="check-btn" onclick="checkAnswer()">Проверить</button>
            </div>
        </div>

        <!-- Вкладка справочника -->
        <div id="dict-tab" class="hidden">
            <input type="text" class="search-input" id="search-bar" placeholder="Поиск блюда или ингредиента..." oninput="filterDict()">
            <div id="dict-list"></div>
        </div>
    </div>

    <script>
        // БАЗА ДАННЫХ МЕНЮ
        const menuData = [
            { id: 1, name: "Салатная заправка", ingredients: ["Устричный соус", "Соевый соус", "Сахар", "Белый рисовый уксус", "Чеснок", "Имбирь", "Зеленый лук", "Чили перец"] },
            { id: 2, name: "Крылышки Сычуаньские", ingredients: ["Качудян", "Томатная паста", "Соевый соус"] },
            { id: 3, name: "5 специй", ingredients: ["Бадьян", "Сычуаньский перец", "Корица", "Имбирь", "Кориандр"] },
            { id: 4, name: "Рисовый соус", ingredients: ["Кунжутное масло", "Устричный соус"] },
            { id: 5, name: "Чоу-мейн (соус)", ingredients: ["Соевый соус", "Устричный соус", "Темный соевый соус", "Белый рисовый уксус", "Кунжутное масло"] },
            { id: 6, name: "Удон (соус)", ingredients: ["Соевый соус", "Устричный соус", "Темный соевый соус", "Белый рисовый уксус", "Кунжутное масло"] },
            { id: 7, name: "Кисло-сладкий соус", ingredients: ["Белый рисовый уксус", "Сахар", "Кетчуп", "Соевый соус", "Ананасовый сок"] },
            { id: 8, name: "Гун бао соус", ingredients: ["Светлый соевый соус", "Темный соевый соус", "Сахар", "Маласянь", "Кунжутное масло", "Белый рисовый уксус"] },
            { id: 9, name: "Цзо соус", ingredients: ["Сахар", "Апельсиновый сок", "Хойсин", "Кетчуп", "Светлый соевый соус", "Темный соевый соус", "Белый рисовый уксус"] },
            { id: 10, name: "Апельсиновый соус", ingredients: ["Апельсиновый сок", "Цедра апельсина", "Апельсины", "Кунжутное масло", "Чеснок", "Имбирь"] },
            { id: 11, name: "Свинина веревочкой", ingredients: ["Свинина", "Вино шаосиньское", "Соевый соус", "Бамбук", "Морковь", "Основания зеленого лука", "Чеснок", "Имбирь", "Муэр", "Соус Табадзян", "Устричный соус"] },
            { id: 12, name: "Хун шао соус", ingredients: ["Бадьян", "Лавровый лист", "Корица", "Сычуаньский перец горошком", "Черный перец горошком", "Соевый соус", "Темный соевый соус", "Вино шаосиньское"] },
            { id: 13, name: "Пекинская свинина", ingredients: ["Свинина 150г", "Соус Барбекю", "Хойсин", "Чеснок", "Имбирь"] },
            { id: 14, name: "Говядина в ЧП", ingredients: ["Говядина", "Морковь", "Лук репчатый", "Перец болгарский", "Брокколи", "Мини кукуруза", "Фасоль", "Соус Блэк Пеппер"] },
            { id: 15, name: "Монгольская говядина", ingredients: ["Говядина", "Морковь", "Перец болгарский", "Лук репчатый", "Сушеный чили перец", "Соус чоу-мейн", "Зеленый лук перо", "Сахар", "Вино шаосиньское", "Основания зеленого лука"] },
            { id: 16, name: "Баранина", ingredients: ["Баранина", "Зира", "Кинза", "Фиолетовый лук", "Соевый соус", "Вино"] },
            { id: 17, name: "Креветки в тайском стиле", ingredients: ["Креветки", "Листья лайма", "Лемонграсс", "Чеснок", "Имбирь", "Тайваньская чили паста", "Базилик", "Соевый соус"] },
            { id: 18, name: "Баклажан со свининой", ingredients: ["Баклажан", "Свинина", "Соус Табадзян", "Чеснок", "Имбирь", "Сахар", "Вино шаосиньское"] },
            { id: 19, name: "Пикантный баклажан", ingredients: ["Баклажан", "Соевый соус темный", "Соевый соус светлый", "Белый рисовый уксус", "Сахар"] },
            { id: 20, name: "Тофу по-домашнему", ingredients: ["Тофу", "Основания зеленого лука", "Морковь", "Болгарский перец", "Шиитаке", "Муэр", "Соус Юсянь"] },
            { id: 21, name: "Три земных свежести", ingredients: ["Картофель/Перец/Баклажан", "Соус маласянь", "Устричный соус", "Сахар"] }
        ];

        // Собираем полный список всех уникальных ингредиентов для формирования ложных вариантов
        const allIngredients = Array.from(new Set(menuData.flatMap(d => d.ingredients)));

        // Состояние приложения
        let currentDish = null;
        let selectedIngredients = new Set();
        let currentOptions = [];
        let streak = 0;
        let maxStreak = localStorage.getItem('maxStreak') || 0;
        let errorList = JSON.parse(localStorage.getItem('errorList')) || [];
        let gameMode = 'all'; // 'all' или 'errors'
        let isChecked = false;

        document.getElementById('max-streak').textContent = maxStreak;

        // Инициализация
        function init() {
            updateErrorStats();
            renderDict();
            nextQuestion();
        }

        function setGameMode(mode, btn) {
            if (mode === 'errors' && errorList.length === 0) {
                alert("У вас пока нет ошибочных блюд! Сыграйте в общий режим.");
                return;
            }
            gameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            nextQuestion();
        }

        function nextQuestion() {
            isChecked = false;
            selectedIngredients.clear();
            
            let pool = menuData;
            if (gameMode === 'errors' && errorList.length > 0) {
                pool = menuData.filter(d => errorList.includes(d.id));
            }

            currentDish = pool[Math.floor(Math.random() * pool.length)];
            document.getElementById('dish-name').textContent = currentDish.name;

            // Формируем варианты (правильные + случайные фейковые)
            const correct = currentDish.ingredients;
            const wrongCandidates = allIngredients.filter(i => !correct.includes(i));
            
            // Берем от 3 до 5 случайных неправильных
            const wrongCount = Math.min(4, wrongCandidates.length);
            const wrong = wrongCandidates.sort(() => 0.5 - Math.random()).slice(0, wrongCount);

            currentOptions = [...correct, ...wrong].sort(() => 0.5 - Math.random());

            const container = document.getElementById('ingredients-container');
            container.innerHTML = '';
            
            currentOptions.forEach((ing, index) => {
                const btn = document.createElement('button');
                btn.className = 'ing-btn';
                btn.textContent = ing;
                btn.onclick = () => toggleIngredient(ing, btn);
                container.appendChild(btn);
            });

            const checkBtn = document.getElementById('check-btn');
            checkBtn.textContent = 'Проверить';
            checkBtn.onclick = checkAnswer;
            checkBtn.style.background = 'var(--accent)';
        }

        function toggleIngredient(ing, btn) {
            if (isChecked) return;
            
            if (selectedIngredients.has(ing)) {
                selectedIngredients.delete(ing);
                btn.classList.remove('selected');
            } else {
                selectedIngredients.add(ing);
                btn.classList.add('selected');
            }
        }

        function checkAnswer() {
            if (isChecked) {
                nextQuestion();
                return;
            }

            if (selectedIngredients.size === 0) {
                alert("Выберите хотя бы один ингредиент!");
                return;
            }

            isChecked = true;
            const correctSet = new Set(currentDish.ingredients);
            let isCorrect = true;

            // Проверяем полноту и точность выбора
            if (selectedIngredients.size !== correctSet.size) {
                isCorrect = false;
            } else {
                for (let item of selectedIngredients) {
                    if (!correctSet.has(item)) {
                        isCorrect = false;
                        break;
                    }
                }
            }

            // Подсветка кнопок
            const btns = document.querySelectorAll('.ing-btn');
            btns.forEach(btn => {
                const text = btn.textContent;
                const isSelected = selectedIngredients.has(text);
                const isTarget = correctSet.has(text);

                if (isTarget) {
                    btn.classList.add('correct');
                } else if (isSelected && !isTarget) {
                    btn.classList.add('wrong');
                }
            });

            if (isCorrect) {
                streak++;
                if (streak > maxStreak) {
                    maxStreak = streak;
                    localStorage.setItem('maxStreak', maxStreak);
                    document.getElementById('max-streak').textContent = maxStreak;
                }
                // Если верно, удаляем из списка ошибок
                errorList = errorList.filter(id => id !== currentDish.id);
            } else {
                streak = 0;
                if (!errorList.includes(currentDish.id)) {
                    errorList.push(currentDish.id);
                }
            }

            localStorage.setItem('errorList', JSON.stringify(errorList));
            document.getElementById('streak').textContent = streak;
            updateErrorStats();

            const checkBtn = document.getElementById('check-btn');
            checkBtn.textContent = 'Следующее блюдо ➔';
            checkBtn.style.background = isCorrect ? 'var(--green)' : 'var(--red)';
        }

        function updateErrorStats() {
            document.getElementById('errors-count').textContent = errorList.length;
            document.getElementById('err-badge').textContent = errorList.length;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'game') {
                document.getElementById('game-tab').classList.remove('hidden');
                document.getElementById('dict-tab').classList.add('hidden');
                event.target.classList.add('active');
            } else {
                document.getElementById('game-tab').classList.add('hidden');
                document.getElementById('dict-tab').classList.remove('hidden');
                event.target.classList.add('active');
            }
        }

        function renderDict(filter = '') {
            const container = document.getElementById('dict-list');
            container.innerHTML = '';
            
            const filtered = menuData.filter(d => 
                d.name.toLowerCase().includes(filter.toLowerCase()) || 
                d.ingredients.some(i => i.toLowerCase().includes(filter.toLowerCase()))
            );

            filtered.forEach(d => {
                const item = document.createElement('div');
                item.className = 'dict-item';
                item.innerHTML = `
                    <h3>${d.id}. ${d.name}</h3>
                    <p><b>Состав:</b> ${d.ingredients.join(', ')}</p>
                `;
                container.appendChild(item);
            });
        }

        function filterDict() {
            const text = document.getElementById('search-bar').value;
            renderDict(text);
        }

        // Авто-регистрация сервиса для полной офлайн-работы
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const blob = new Blob([`
                    self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
                `], { type: 'text/javascript' });
                const url = URL.createObjectURL(blob);
                navigator.serviceWorker.register(url).catch(() => {});
            });
        }

        init();
    </script>
</body>
</html>
